# LatteOS — systémové menu (šálka Latte na lište). Návrh: inspo/LatteOS – návrh plochy, obrazovka
# „systémové menu“: Relácia · Systém · Napájanie, doplnené o režim LatteOS (latte-boot, stupeň, okná).
# Nič nevypne priamo: napájanie potvrdzuje druhé kliknutie.

id          = "latteos/system"
name        = "LatteOS Systém"
version     = "0.1.0"
plugin_api  = 9
author      = "latteos"
license     = "MIT"
dependencies = []
tags        = ["latteos", "system"]
icon        = "coffee"
description = "Šálka: účet a Odhlásiť, Nastavenia, Monitor, rýchly stupeň a režim okien, napájanie."

[[widget]]
id    = "cup"
entry = "widget.luau"

[[widget]]
id    = "subory"
entry = "subory.luau"

[[panel]]
id        = "menu"
entry     = "menu.luau"
width     = 400
height    = 470
placement = "floating"   # pri kliknutom ostrove (attached by pri priehľadnej lište bol priehľadný)
position  = "auto"
open_near_click = true
