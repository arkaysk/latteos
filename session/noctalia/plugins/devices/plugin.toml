# LatteOS — Zariadenia (rýchla tvár Device Managera; návrh plochy: obrazovka „Device Manager“).
# Stupeň výkonu, Wi-Fi, Bluetooth, Nerušiť, nočné svetlo, hlasitosť, jas, herný režim a profil výkonu.
# HDR, VRR a limit FPS prídu s reálnym HW (fáza H); NET podľa aplikácií s bezpečnostným modelom (F6).

id          = "latteos/devices"
name        = "LatteOS Zariadenia"
version     = "0.1.0"
plugin_api  = 25
author      = "latteos"
license     = "MIT"
dependencies = []
tags        = ["latteos", "devices"]
icon        = "adjustments"
description = "Riadiace centrum LatteOS: sieť, zvuk, jas, herný režim, profil výkonu."

[[widget]]
id    = "dev"
entry = "widget.luau"

# indikátor súkromia: mikrofón/kamera práve v použití (neviditeľný, kým ich nikto nepoužíva)
[[widget]]
id    = "sukromie"
entry = "sukromie.luau"

# senzory na lište (Monitor › Senzory › Pridať na lištu); neviditeľné, kým nie je nič vybrané
[[widget]]
id    = "senzory"
entry = "senzory.luau"

# dashboard Noctalie (riadiace centrum) ako malé úzke tlačidlo
[[widget]]
id    = "dash"
entry = "dash.luau"

[[panel]]
id        = "panel"
entry     = "panel.luau"
width     = 400
height    = 640
placement = "floating"   # pri kliknutom ostrove (attached by pri priehľadnej lište bol priehľadný)
position  = "auto"
open_near_click = true
