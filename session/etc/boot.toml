# LatteOS — /etc/latteos/boot.toml (číta latte-boot)

# VMSVGA 3D vo VirtualBoxe: experimentálne, klienti sa bez render volieb zasekávajú (docs_zaloha/2026-09-23-f1-merania-vm.md)
allow_vm3d = false

# po koľkých pádoch relácie NORMAL za sebou naštartuje SAFE
crash_limit = 2

# relácia je zdravá po toľkých sekundách (latte-boot ok --after)
healthy_secs = 60

# obrazovka prihlásenia: "latte" (vlastný, Quickshell pod labwc + pixman), "tui" (tuigreet), "noctalia" alebo
# "goo" (prihlásenie LatteOS GOO: scéna enginu Goo vo všeobecnej relácii; iba s grafickou kartou, inak a po páde
# nasleduje "latte") — zatiaľ na skúšku, LATTEOS-GOO.md §6.2
# noctalia zatiaľ vypnutý: pod greetd na VirtualBoxe prepúšťa pamäť jadra (docs_zaloha/2026-09-23-f1-merania-vm.md)
greeter = "goo"
