# LatteOS — Hyprland, relácia NORMAL (inštaluje sa do /usr/share/latteos/hypr/hyprland.conf).
# F1: základná konfigurácia v hyprlang; Lua modul LatteOS (stupne, páska, gestá) príde vo F2.

# nastavenia podľa režimu a stupňa (kurzor, efekty, vm-3d) — generuje latte-boot select
source = /run/latteos/hyprland.conf

monitor = , preferred, auto, 1

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,latteos

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE LATTE_MODE LATTE_RENDERER LATTE_TIER
exec-once = noctalia
# relácia je zdravá, ak po 60 s beží shell → počítadlo pádov = 0
exec-once = latte-boot ok --after 60 --require noctalia

input {
    kb_layout = sk,us
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgb(c8a27a)
    col.inactive_border = rgb(3b2f2a)
    layout = dwindle
}

decoration {
    rounding = 14
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# bez uvítacej aplikácie a noviniek Hyprlandu (hyprland-welcome v VM padal)
ecosystem {
    no_update_news = true
    no_donation_nag = true
}

$mod = SUPER
bind = $mod, Return, exec, foot
bind = $mod, Space, exec, noctalia msg panel-toggle launcher
bind = $mod, Tab, exec, noctalia msg window-switcher
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod SHIFT, M, exit
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, Left, movewindow, mon:l
bind = $mod SHIFT, Right, movewindow, mon:r
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
